name: Sincronizar calendario diario

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

concurrency:
  group: daily-calendar-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Actualizar calendario 2026
        env:
          BIBLE_API_KEY: ${{ secrets.BIBLE_API_KEY }}
        run: npm run sync:daily -- --start 2026-09-10 --end 2026-12-31
      - name: Actualizar nombres de santos de Vatican News
        id: sync_vatican_saints
        continue-on-error: true
        run: npm run sync:vatican-saints
      - name: Validar lecturas
        run: npm run validate:daily -- --year 2026 --start 2026-09-10 --end 2026-12-31
      - name: Guardar cambios
        run: |
          if git diff --quiet -- public/data/daily-readings; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/daily-readings
          git commit -m "chore: sincronizar evangelios diarios"
          git push
      - name: Registrar estado de la captura secundaria
        if: always()
        env:
          VATICAN_OUTCOME: ${{ steps.sync_vatican_saints.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$VATICAN_OUTCOME" = "failure" ]; then
            echo "::warning title=Captura secundaria degradada::Vatican News no se actualizó; se conserva la última captura válida y la publicación primaria continúa."
            {
              echo "### Advertencia: captura secundaria de Vatican News"
              echo ""
              echo "La captura opcional falló o fue rechazada por el parser. Se conservó la última captura válida; la validación y publicación primaria continuaron."
              echo ""
              echo "[Ver ejecución completa]($RUN_URL)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Captura secundaria de Vatican News: $VATICAN_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          fi
