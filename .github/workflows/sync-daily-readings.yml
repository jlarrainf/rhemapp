name: Sincronizar evangelios diarios

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Actualizar calendario 2026
        env:
          BIBLE_API_KEY: ${{ secrets.BIBLE_API_KEY }}
        run: npm run sync:daily -- --start 2026-09-10 --end 2026-12-31
      - name: Validar lecturas
        run: npm run validate:daily -- --year 2026 --start 2026-09-10 --end 2026-12-31
      - name: Guardar cambios
        run: |
          if git diff --quiet -- public/data/daily-readings; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/daily-readings
          git commit -m "chore: sincronizar evangelios diarios"
          git push
